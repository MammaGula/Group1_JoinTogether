# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - jointogether-frontend

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      # Byt VITE_API_BASE_URL till din riktiga API-URL i Azure
      # (samma namn som app-name i deploy-api.yml, + ".azurewebsites.net")
      - name: npm install, build, and test
        working-directory: ./jointogether.client
        env:
          VITE_API_BASE_URL: https://jointogether-api.azurewebsites.net/api
          VITE_MAPBOX_ACCESS_TOKEN: ${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./jointogether.client/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_JOINTOGETHER_FRONTEND }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_JOINTOGETHER_FRONTEND }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_JOINTOGETHER_FRONTEND }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "jointogether-frontend"
          slot-name: "Production"
          package: .
