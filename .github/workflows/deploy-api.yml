name: Build and deploy JoinTogether API to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # Hämtar koden från GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installerar .NET
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      # Restore för just API-projektet
      - name: Restore dependencies
        run: dotnet restore ./JoinTogether.API/JoinTogether.API.csproj

      # Bygger just API-projektet
      - name: Build JoinTogether.API
        run: dotnet build ./JoinTogether.API/JoinTogether.API.csproj --configuration Release --no-restore

      # Publicerar API:t till en separat mapp
      - name: Publish JoinTogether.API
        run: dotnet publish ./JoinTogether.API/JoinTogether.API.csproj --configuration Release --output ./publish --no-build

      # Sparar det publicerade API:t som artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      # Hämtar det publicerade API:t från build-jobbet
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      # Loggar in mot Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_JOINTOGETHER_API }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_JOINTOGETHER_API }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_JOINTOGETHER_API }}

      # Deployar API:t till Azure App Service
      # Byt app-name till namnet du gav din App Service i Azure Portal.
      - name: Deploy JoinTogether.API to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'jointogether-api'
          slot-name: 'Production'
          package: ./publish
